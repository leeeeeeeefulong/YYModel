name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Swift test
        run: swift test
  release-e2e:
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Release E2E (macOS, Swift 6 strict)
        run: python3 Verification/release-20261006/run.py --output /tmp/yymodel-e2e-macos
      - name: Fixture provenance check
        run: python3 -c "import json,hashlib,pathlib; f=pathlib.Path('/tmp/yymodel-e2e-macos/fixtures/weather-api.json'); m=json.loads(pathlib.Path('/tmp/yymodel-e2e-macos/fixtures/weather-source.json').read_text()); assert hashlib.sha256(f.read_bytes()).hexdigest()==m['sha256'] and f.stat().st_size==m['bytes']"
