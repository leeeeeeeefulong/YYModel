name: Public API E2E

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  acceptance:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Public consumer acceptance
        run: python3 Validation/remediation/run.py --output "$RUNNER_TEMP/yymodel-e2e"
      - name: Strict languages and deployment floors
        run: python3 Validation/remediation/verify_platforms.py --acceptance-root "$RUNNER_TEMP/yymodel-e2e" --output "$RUNNER_TEMP/yymodel-platforms"
      - name: Complete business and numeric oracle
        run: python3 Validation/run_swift_model_data.py --source-root "$RUNNER_TEMP/yymodel-e2e/source" --output "$RUNNER_TEMP/yymodel-business" --samples 1 --iterations 1
      - name: Existing regression suite
        if: always()
        run: swift test -c release > "$RUNNER_TEMP/swift-test.log" 2>&1
      - name: Preserve repeatable evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: yymodel-acceptance-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/yymodel-e2e/*.json
            ${{ runner.temp }}/yymodel-e2e/*.log
            ${{ runner.temp }}/yymodel-e2e/source/
            ${{ runner.temp }}/swift-test.log
            ${{ runner.temp }}/yymodel-platforms/
            ${{ runner.temp }}/yymodel-business/*.json
            ${{ runner.temp }}/yymodel-business/*.log
          retention-days: 30
